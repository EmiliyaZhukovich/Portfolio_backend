<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать задачу</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключение пользовательских стилей -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Редактировать задачу</h1>

        <!-- Форма редактирования задачи -->
        <form action="{{ url_for('edit_task', task_id=task.id) }}" method="post" class="task-form">
            <div class="form-group mb-3">
                <label for="title" class="form-label">Заголовок:</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ task.title }}" required>
            </div>

            <div class="form-group mb-4">
                <label for="description" class="form-label">Описание:</label>
                <textarea id="description" name="description" class="form-control" rows="4" required>{{ task.description }}</textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-save">Сохранить изменения</button>
                <a href="/home" class="btn btn-back ms-3">Назад</a>
            </div>
        </form>
    </div>

    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
